}

/* =====================================================
   SEMILLA
===================================================== */

function crearSemilla(codigo){

    let numero=0;

    for(let i=0;i<codigo.length;i++){

        numero+=codigo.charCodeAt(i);

    }

    return numero;

}


/* =====================================================
   MEZCLA
===================================================== */

function mezclarConSemilla(lista){

    let resultado=[...lista];

    let numero=semilla;

    for(
        let i=resultado.length-1;
        i>0;
        i--
    ){

        numero=
            (numero*9301+49297)%233280;

        let posicion=Math.floor(
            (numero/233280)*(i+1)
        );

        let temporal=resultado[i];

        resultado[i]=resultado[posicion];

        resultado[posicion]=temporal;

    }

    return resultado;

}


/* =====================================================
   CREAR TABLERO
===================================================== */

function crearTablero(){

    sonido("click");

    cantidadCartasTablero=
        Number(
            document.getElementById(
                "dificultad"
            ).value
        );

    tableroJugador=
        [...cartas]
        .sort(()=>Math.random()-.5)
        .slice(0,cantidadCartasTablero);

    let tablero=
        document.getElementById("tablero");

    tablero.innerHTML="";

    tableroJugador.forEach(carta=>{

        let nuevaCarta=
            document.createElement("div");

        nuevaCarta.className="carta";

        nuevaCarta.innerHTML=carta;

        nuevaCarta.onclick=function(){

            nuevaCarta.classList.toggle(
                "marcada"
            );

            sonido("marcar");

        };

        tablero.appendChild(nuevaCarta);

    });

    mensaje(
        "🎴 Tablero creado con "+
        cantidadCartasTablero+
        " cartas."
    );

}


/* =====================================================
   CRONÓMETRO
===================================================== */

function iniciarCronometro(){

    sonido("click");

    if(tiempoActivo){

        mensaje(
            "⏱️ El cronómetro ya está funcionando."
        );

        return;
    }

    tiempoActivo=true;

    reloj=setInterval(()=>{

        segundos++;

        if(segundos===60){

            segundos=0;
            minutos++;

        }

        if(minutos===60){

            minutos=0;
            horas++;

        }

        document.getElementById(
            "cronometro"
        ).innerHTML=
            "⏱️ Tiempo: "+
            String(horas).padStart(2,"0")+":"+
            String(minutos).padStart(2,"0")+":"+
            String(segundos).padStart(2,"0");

    },1000);

}

function siguienteCarta(){

       Si no existe partida,
       la creamos automáticamente.

    if(codigoActual===null){

        codigoActual="LOCAL";

        semilla=crearSemilla(

        cartasOrdenadas=
            mezclarConSemilla(cartas);

        document.getElementById(
            "codigoPartida"
        ).innerHTML=
            "Código: LOCAL";

        mensaje(
            "🎮 Partida local iniciada."
        );

    }


    if(contadorCartas>=54){

        sonido("error");

        mensaje(
            "⚠️ Ya salieron las 54 cartas."
        );

        return;
    }

    let carta=
        cartasOrdenadas[
            contadorCartas
        ];

    cartasSalidas.push(carta);

    contadorCartas++;

    let cartaActual=
        document.getElementById(
            "cartaActual"
        );

    cartaActual.innerHTML=
        "Carta actual:<br>"+carta;

    cartaActual.classList.remove(
        "nueva"
    );

    void cartaActual.offsetWidth;

    cartaActual.classList.add(
        "nueva"
    );

    document.getElementById(
        "fraseActual"
    ).innerHTML=
        "Frase:<br>"+
        frases[carta];

    document.getElementById(
        "contador"
    ).innerHTML=
        "Carta "+
        contadorCartas+
        " de 54";

    sonido("carta");

    /*
       Comprobar automáticamente si
       ya puede haber Lotería.
    */

    comprobarAutomaticamente();

}


/* =====================================================

===================================================== */

function comprobarLoteria(){

    sonido("click");

    let cartasMarcadas=
        document.querySelectorAll(
            ".carta.marcada"
        );

    if(tableroJugador.length===0){

        sonido("error");

        mensaje(
            "⚠️ Primero crea tu tablero."
        );

        return;
    }

    if(
        cartasMarcadas.length
        !==
        cantidadCartasTablero
    ){

        sonido("error");

        mensaje(
            "⚠️ Todavía faltan cartas por marcar."
        );

        return;
    }

    for(let carta of tableroJugador){

        if(!cartasSalidas.includes(carta)){

            sonido("error");

            mensaje(
                "❌ No puedes ganar todavía. "+
                "Faltan cartas por salir."
            );

            return;
        }

    }

    sonido("win");

    mensaje(
        "🎉 ¡LOTERÍA! ¡GANASTE LA PARTIDA! 🏆"
    );

}

        cantidadCartasTablero
    ){

        for(let carta of tableroJugador){

            if(
                !cartasSalidas.includes(carta)
            ){

                return;
            }

        }

        sonido("win");

        mensaje(
            "🎉 ¡LOTERÍA AUTOMÁTICA! 🏆"
        );

    }

}


/* =====================================================
   MENSAJES
===================================================== */

function mensaje(texto){

    document.getElementById(
        "mensajeJuego"
    ).innerHTML=texto;

}


/* =====================================================
   REINICIAR
===================================================== */

function reiniciarJuego(){

    sonido("click");

    clearInterval(reloj);

    tableroJugador=[];
    cartasSalidas=[];
    contadorCartas=0;

    semilla=0;
    cartasOrdenadas=[];

    cantidadCartasTablero=
        Number(
            document.getElementById(
                "dificultad"
            ).value
        );

    segundos=0;
    minutos=0;
    horas=0;

    tiempoActivo=false;
    reloj=null;

    codigoActual=null;

    document.getElementById(
        "codigoPartida"
    ).innerHTML=
        "Código: ------";

    document.getElementById(
        "cartaActual"
    ).innerHTML=
        "Carta actual:<br>❓";

    document.getElementById(
        "fraseActual"
    ).innerHTML=
        "Frase:<br>...";

    document.getElementById(
        "contador"
    ).innerHTML=
        "Carta 0 de 54";

    document.getElementById(
        "cronometro"
    ).innerHTML=
        "⏱️ Tiempo: 00:00:00";

    document.getElementById(
        "tablero"
    ).innerHTML="";

    document.getElementById(
        "codigoEntrada"
    ).value="";

    mensaje(
        "🔄 Juego reiniciado."
    );

}

crearTablero();
