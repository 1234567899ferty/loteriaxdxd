<style>
/* ===== DISEÑO GENERAL ===== */

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5e6c8;
    margin: 0;
    padding: 20px;
}


/* ===== TÍTULO DEL JUEGO ===== */

h1 {
    color: #8b0000;
    font-size: 35px;
}


/* ===== CARTA QUE SALE ===== */

#cartaActual {
  background: white;
    border: 3px solid #8b0000;
    border-radius: 15px;
    width: 250px;
    margin: 20px auto;
    padding: 20px;
    font-size: 25px;
}

#fraseActual {
    background: #fff8dc;
    border: 2px solid #8b0000;
    border-radius: 15px;
    width: 250px;
    margin: 10px auto 20px auto;
    padding: 15px;
    font-size: 18px;
    font-style: italic;
}

/* ===== BOTÓN SIGUIENTE CARTA ===== */

button {
    background: #8b0000;
    color: white;
    border: none;
    border-radius: 10px;
    padding: 15px 25px;
    font-size: 18px;
    cursor: pointer;
}


/* Cambia cuando pasas el dedo o mouse encima */

button:hover {
    background: #b22222;
}


/* ===== TABLERO DE LOTERÍA ===== */

#tablero {
    display: grid;
    grid-template-columns: repeat(3, 100px);
    gap: 10px;
    justify-content: center;
    margin-top: 20px;
}


/* ===== CARTAS DEL TABLERO ===== */

.carta {
    width: 100px;
    height: 130px;
    background: white;
    border: 2px solid black;
    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
    font-size: 16px;
}


/* ===== CARTA MARCADA ===== */

.carta.marcada {
    background: #ddd;
    text-decoration: line-through;
    opacity: 0.6;
}

</style>

</head>

</button>

⏱️ Iniciar cronómetro

<div id="tablero">

// ===== VARIABLES DEL JUEGO =====

let tableroJugador = [];

let cartasSalidas = [];

let contadorCartas = 0;

let semilla = 0;

let cartasOrdenadas = [];

let cantidadCartasTablero = 12;

let segundos = 0;

let minutos = 0;

let horas = 0;

let tiempoActivo = false;

let reloj;


// ===== CREAR CÓDIGO DE PARTIDA =====

let codigoActual = null;


function crearPartida(){

    if(codigoActual != null){

        document.getElementById("codigoPartida").innerHTML =
        "Código: " + codigoActual;
semilla = crearSemilla(codigoActual);
cartasOrdenadas = mezclarConSemilla(cartas);
        return;

    }


    let caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


    codigoActual = "LOT-";


    for(let i = 0; i < 6; i++){

        codigoActual += caracteres[
            Math.floor(Math.random() * caracteres.length)
        ];

    }


    document.getElementById("codigoPartida").innerHTML =
    "Código: " + codigoActual;
semilla = crearSemilla(codigoActual);
cartasOrdenadas = mezclarConSemilla(cartas);

}

// ===== UNIRSE A PARTIDA =====

function unirsePartida(){

    let codigo = document.getElementById("codigoEntrada").value;


    if(codigo == ""){

        alert("Escribe un código de partida");

        return;

    }


    codigoActual = codigo;


    semilla = crearSemilla(codigoActual);


    cartasOrdenadas = mezclarConSemilla(cartas);


    document.getElementById("codigoPartida").innerHTML =
    "Código: " + codigoActual;


    alert("Te uniste a la partida");

}

// ===== CONVERTIR CÓDIGO EN SEMILLA =====

function crearSemilla(codigo){

    let numero = 0;


    for(let i = 0; i < codigo.length; i++){

        numero += codigo.charCodeAt(i);

    }


    return numero;

}

// ===== MEZCLAR CON SEMILLA =====

function mezclarConSemilla(lista){

    let resultado = [...lista];

    let numero = semilla;


    for(let i = resultado.length - 1; i > 0; i--){

        numero = (numero * 9301 + 49297) % 233280;


        let posicion = Math.floor(
            (numero / 233280) * (i + 1)
        );


        let temporal = resultado[i];

        resultado[i] = resultado[posicion];

        resultado[posicion] = temporal;

    }


    return resultado;

}
// ===== CREAR TABLERO =====

function crearTablero(){

    cantidadCartasTablero = Number(
        document.getElementById("dificultad").value
    );


    tableroJugador = [...cartas]
    .sort(() => Math.random() - 0.5)
    .slice(0,cantidadCartasTablero);

    let tablero = document.getElementById("tablero");

    tablero.innerHTML = "";


    tableroJugador.forEach(carta => {

        let nuevaCarta = document.createElement("div");

        nuevaCarta.className = "carta";
nuevaCarta.innerHTML = carta;
        // Marcar carta al tocar

        nuevaCarta.onclick = function(){

            nuevaCarta.classList.toggle("marcada");

        };


        tablero.appendChild(nuevaCarta);

    });

}


// ===== CRONÓMETRO =====

function iniciarCronometro(){

    if(tiempoActivo) return;

    tiempoActivo = true;

    reloj = setInterval(()=>{

        segundos++;

        if(segundos == 60){
            segundos = 0;
            minutos++;
        }

        if(minutos == 60){
            minutos = 0;
            horas++;
        }

        document.getElementById("cronometro").innerHTML =
        "⏱️ Tiempo: " +
        String(horas).padStart(2,"0") + ":" +
        String(minutos).padStart(2,"0") + ":" +
        String(segundos).padStart(2,"0");

    },1000);

}

// ===== SACAR SIGUIENTE CARTA =====

function siguienteCarta(){

    if(contadorCartas >= 54){

        alert("Ya salieron todas las cartas");

        return;

    }

let carta = cartasOrdenadas[contadorCartas];

    cartasSalidas.push(carta);


    contadorCartas++;


    document.getElementById("cartaActual").innerHTML =
    "Carta actual:<br>" + carta;
document.getElementById("fraseActual").innerHTML =
"Frase:<br>" + frases[carta];

    document.getElementById("contador").innerHTML =
    "Carta " + contadorCartas + " de 54";

}

// ===== COMPROBAR LOTERÍA =====

function comprobarLoteria(){

    let cartasMarcadas = document.querySelectorAll(".carta.marcada");


if(cartasMarcadas.length != cantidadCartasTablero){

    alert("⚠️ Todavía faltan cartas por marcar");

    return;

}

    for(let carta of tableroJugador){

        if(!cartasSalidas.includes(carta)){

            alert("❌ No puedes ganar todavía. Faltan cartas por salir");

            return;

        }

    }


    alert("🎉 ¡LOTERÍA! Ganaste la partida 🏆");

}

// ===== INICIAR JUEGO =====
crearTablero();
alert("Hola Bienvenido,a");
